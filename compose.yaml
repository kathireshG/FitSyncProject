name: fitsync

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/fitness
      CLIENT_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-before-sharing}
      JWT_EXPIRES_IN: 1d
      RESET_TOKEN_TTL_MINUTES: 30
      UPLOAD_DIR: /app/uploads/avatars
    ports:
      - "4000:4000"
    volumes:
      - avatar_uploads:/app/uploads/avatars
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/fit-sync
      args:
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  avatar_uploads:
